# Ejecuta las pruebas automáticas en cada Pull Request y en cada cambio a main.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
